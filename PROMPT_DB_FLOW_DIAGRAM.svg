<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc">
  <title id="title">Prompt DB Flow Diagram</title>
  <desc id="desc">Flow of prompts, database tables, mirror matching, and prompt rendering context.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #18212b; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #4d5c6b; }
      .box { rx: 8; ry: 8; stroke-width: 2; }
      .prompt { fill: #dff3ea; stroke: #3d8b6d; }
      .db { fill: #e7eefc; stroke: #4a6fb3; }
      .tile { fill: #f6eadb; stroke: #b57a28; }
      .ctx { fill: #f3e4f7; stroke: #8b4ea3; }
      .label { font-size: 15px; font-weight: 700; }
      .small { font-size: 13px; }
      .group { fill: #fbfcfe; stroke: #b8c4d2; stroke-width: 2; stroke-dasharray: 8 6; rx: 8; ry: 8; }
      .group-title { font-size: 18px; font-weight: 700; fill: #334155; }
      .arrow { stroke: #5f6f82; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6f82" />
    </marker>
  </defs>

  <text x="48" y="50" class="title">Prompt- und DB-Flow</text>
  <text x="48" y="78" class="subtitle">Von der Gesetzeszusammenfassung bis zur Kostenberechnung, inklusive Mirror-Matching und Prompt-Kontext.</text>

  <rect x="36" y="110" width="980" height="1030" class="group" />
  <text x="58" y="140" class="group-title">Workflow und Persistenz</text>

  <rect x="70" y="180" width="250" height="64" class="box prompt" />
  <text x="195" y="208" text-anchor="middle" class="label">law_summary</text>
  <text x="195" y="229" text-anchor="middle" class="small">erstellt Titel, Blurb, Summary</text>

  <rect x="410" y="172" width="260" height="78" class="box db" />
  <text x="540" y="202" text-anchor="middle" class="label">sessions</text>
  <text x="540" y="223" text-anchor="middle" class="small">law_diff_title / blurb / summary</text>

  <rect x="760" y="180" width="190" height="64" class="box tile" />
  <text x="855" y="208" text-anchor="middle" class="label">law_tile</text>
  <text x="855" y="229" text-anchor="middle" class="small">Anzeige der Kurzfassung</text>

  <rect x="70" y="292" width="250" height="64" class="box prompt" />
  <text x="195" y="320" text-anchor="middle" class="label">regulations_identification</text>
  <text x="195" y="341" text-anchor="middle" class="small">inkl. normadressaten + spiegelinfo</text>

  <rect x="410" y="280" width="260" height="90" class="box db" />
  <text x="540" y="309" text-anchor="middle" class="label">regulations</text>
  <text x="540" y="330" text-anchor="middle" class="small">citation, description, change_status</text>
  <text x="540" y="349" text-anchor="middle" class="small">mirror_anchor_key, mirror_description</text>

  <rect x="760" y="292" width="190" height="64" class="box tile" />
  <text x="855" y="320" text-anchor="middle" class="label">regulation_tiles</text>
  <text x="855" y="341" text-anchor="middle" class="small">je Vorgabe ein Tile</text>

  <rect x="70" y="420" width="250" height="74" class="box prompt" />
  <text x="195" y="447" text-anchor="middle" class="label">process_compilation</text>
  <text x="195" y="468" text-anchor="middle" class="small">pro Normadressat</text>
  <text x="195" y="486" text-anchor="middle" class="small">liest Regulations + Mirror-Kontext</text>

  <rect x="410" y="420" width="260" height="74" class="box db" />
  <text x="540" y="447" text-anchor="middle" class="label">processes</text>
  <text x="540" y="468" text-anchor="middle" class="small">Prozesse je Normadressat</text>
  <text x="540" y="486" text-anchor="middle" class="small">inkl. Regulation-&gt;Prozess-Zuordnung</text>

  <rect x="760" y="430" width="190" height="64" class="box tile" />
  <text x="855" y="458" text-anchor="middle" class="label">process_tiles</text>
  <text x="855" y="479" text-anchor="middle" class="small">Anzeige der Prozesse</text>

  <rect x="70" y="554" width="250" height="74" class="box prompt" />
  <text x="195" y="581" text-anchor="middle" class="label">case_group_development</text>
  <text x="195" y="602" text-anchor="middle" class="small">pro Normadressat</text>
  <text x="195" y="620" text-anchor="middle" class="small">liest Prozesse + Mirror-Kontext</text>

  <rect x="410" y="554" width="260" height="74" class="box db" />
  <text x="540" y="581" text-anchor="middle" class="label">case_groups</text>
  <text x="540" y="602" text-anchor="middle" class="small">Fallgruppen je Prozess</text>
  <text x="540" y="620" text-anchor="middle" class="small">spaeter auch Fallzahlen</text>

  <rect x="760" y="564" width="190" height="64" class="box tile" />
  <text x="855" y="592" text-anchor="middle" class="label">case_group_tiles</text>
  <text x="855" y="613" text-anchor="middle" class="small">Anzeige der Fallgruppen</text>

  <rect x="70" y="688" width="250" height="74" class="box prompt" />
  <text x="195" y="715" text-anchor="middle" class="label">process_step_analysis</text>
  <text x="195" y="736" text-anchor="middle" class="small">pro Normadressat</text>
  <text x="195" y="754" text-anchor="middle" class="small">liest Fallgruppen + Mirror-Kontext</text>

  <rect x="410" y="688" width="260" height="74" class="box db" />
  <text x="540" y="715" text-anchor="middle" class="label">process_steps</text>
  <text x="540" y="736" text-anchor="middle" class="small">Taetigkeiten / Schritte</text>
  <text x="540" y="754" text-anchor="middle" class="small">spaeter auch Aufwand pro Fall</text>

  <rect x="760" y="698" width="190" height="64" class="box tile" />
  <text x="855" y="726" text-anchor="middle" class="label">step_tiles</text>
  <text x="855" y="747" text-anchor="middle" class="small">Anzeige der Schritte</text>

  <rect x="70" y="820" width="250" height="74" class="box prompt" />
  <text x="195" y="847" text-anchor="middle" class="label">mirror_matching</text>
  <text x="195" y="868" text-anchor="middle" class="small">implizit via ensure_mirror_matching</text>
  <text x="195" y="886" text-anchor="middle" class="small">aus effort-Route (kein UI-Schritt)</text>

  <rect x="410" y="820" width="260" height="74" class="box db" />
  <text x="540" y="847" text-anchor="middle" class="label">mirror_matches</text>
  <text x="540" y="868" text-anchor="middle" class="small">source/target, relation_type</text>
  <text x="540" y="886" text-anchor="middle" class="small">sync_addressees / frequency / cases</text>

  <rect x="70" y="952" width="250" height="74" class="box prompt" />
  <text x="195" y="979" text-anchor="middle" class="label">cases_calculation</text>
  <text x="195" y="1000" text-anchor="middle" class="small">pro Normadressat</text>
  <text x="195" y="1018" text-anchor="middle" class="small">liest Match + Fallgruppen</text>

  <rect x="410" y="952" width="260" height="74" class="box prompt" />
  <text x="540" y="979" text-anchor="middle" class="label">effort_calculation</text>
  <text x="540" y="1000" text-anchor="middle" class="small">pro Normadressat (Match nur als Gate)</text>
  <text x="540" y="1018" text-anchor="middle" class="small">liest Prozessschritte + Fallgruppen</text>

  <rect x="760" y="944" width="190" height="82" class="box db" />
  <text x="855" y="973" text-anchor="middle" class="label">Kostenbasis</text>
  <text x="855" y="994" text-anchor="middle" class="small">case_groups: Fallzahlen</text>
  <text x="855" y="1013" text-anchor="middle" class="small">process_steps: Aufwand</text>

  <rect x="760" y="1068" width="190" height="64" class="box prompt" />
  <text x="855" y="1096" text-anchor="middle" class="label">total_cost</text>
  <text x="855" y="1117" text-anchor="middle" class="small">deterministische Berechnung</text>

  <rect x="1110" y="110" width="450" height="560" class="group" />
  <text x="1132" y="140" class="group-title">Prompt Rendering / Zusatzkontext</text>

  <rect x="1150" y="190" width="360" height="74" class="box ctx" />
  <text x="1330" y="217" text-anchor="middle" class="label">sessions summary</text>
  <text x="1330" y="238" text-anchor="middle" class="small">`law_summary` wird in Folgeprompts eingespeist</text>

  <rect x="1150" y="322" width="360" height="88" class="box ctx" />
  <text x="1330" y="349" text-anchor="middle" class="label">norm addressee rules</text>
  <text x="1330" y="370" text-anchor="middle" class="small">Verwaltung / Wirtschaft / Buerger</text>
  <text x="1330" y="389" text-anchor="middle" class="small">werden beim Rendern automatisch angehaengt</text>

  <rect x="1150" y="468" width="360" height="138" class="box ctx" />
  <text x="1330" y="495" text-anchor="middle" class="label">mirror_context</text>
  <text x="1330" y="516" text-anchor="middle" class="small">liest regulations, processes, case_groups,</text>
  <text x="1330" y="535" text-anchor="middle" class="small">process_steps, mirror_matches und baut</text>
  <text x="1330" y="554" text-anchor="middle" class="small">strukturierten Spiegelkontext fuer</text>
  <text x="1330" y="573" text-anchor="middle" class="small">process/case_group/step/cases-Prompts auf</text>
  <text x="1330" y="592" text-anchor="middle" class="small">(nicht fuer effort_calculation)</text>

  <rect x="1110" y="724" width="450" height="408" class="group" />
  <text x="1132" y="754" class="group-title">Kernaussage</text>
  <text x="1148" y="806" class="small">1. Jeder Prompt schreibt einen fachlichen Zwischenschritt in die DB.</text>
  <text x="1148" y="844" class="small">2. Der naechste Prompt liest genau diese Vorstufe wieder ein.</text>
  <text x="1148" y="882" class="small">3. Spiegelsituationen werden nicht nur erwaehnt,</text>
  <text x="1148" y="904" class="small">   sondern als strukturierte Daten gespeichert.</text>
  <text x="1148" y="942" class="small">4. Mirror-Matching verbindet addresseatenuebergreifende</text>
  <text x="1148" y="964" class="small">   Fallgruppen explizit.</text>
  <text x="1148" y="1002" class="small">5. Bei klaren 1:1-Faellen koennen Fallzahlen</text>
  <text x="1148" y="1024" class="small">   deterministisch synchronisiert werden.</text>

  <path d="M320 212 L410 211" class="arrow" />
  <path d="M670 211 L760 212" class="arrow" />

  <path d="M195 244 L195 292" class="arrow" />
  <path d="M320 324 L410 325" class="arrow" />
  <path d="M670 324 L760 324" class="arrow" />

  <path d="M195 356 L195 420" class="arrow" />
  <path d="M320 457 L410 457" class="arrow" />
  <path d="M670 457 L760 462" class="arrow" />

  <path d="M195 494 L195 554" class="arrow" />
  <path d="M320 591 L410 591" class="arrow" />
  <path d="M670 591 L760 596" class="arrow" />

  <path d="M195 628 L195 688" class="arrow" />
  <path d="M320 725 L410 725" class="arrow" />
  <path d="M670 725 L760 730" class="arrow" />

  <path d="M195 762 L195 820" class="arrow" />
  <path d="M320 857 L410 857" class="arrow" />

  <path d="M195 894 L195 952" class="arrow" />
  <path d="M540 894 L540 952" class="arrow" />
  <path d="M670 985 L760 985" class="arrow" />
  <path d="M855 1026 L855 1068" class="arrow" />

  <path d="M670 325 C 900 325, 970 227, 1150 227" class="arrow" />
  <path d="M670 457 C 930 457, 1000 528, 1150 528" class="arrow" />
  <path d="M670 591 C 930 591, 1000 528, 1150 528" class="arrow" />
  <path d="M670 725 C 930 725, 1000 528, 1150 528" class="arrow" />
  <path d="M670 857 C 930 857, 1000 528, 1150 528" class="arrow" />
  <path d="M1510 227 C 1540 227, 1540 457, 950 457" class="arrow" />
  <path d="M1510 366 C 1540 366, 1540 591, 950 591" class="arrow" />
  <path d="M1510 528 C 1540 528, 1540 725, 950 725" class="arrow" />
  <path d="M1510 528 C 1540 528, 1540 989, 320 989" class="arrow" />
</svg>
